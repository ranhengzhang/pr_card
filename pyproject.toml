[project]
name = "pr-card"
version = "0.1.0"
description = "GitHub PR 卡片生成器"
requires-python = ">=3.13"
dependencies = [
    "pygithub>=2.1.0",
    "jinja2>=3.1.0",
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "markdown>=3.5.0",
    "pillow>=10.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "coverage>=7.3.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
]